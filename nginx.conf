server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpe?g|svg|webp|gif|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
    }

    location ~ ^/(Ch1-Introduction-to-Alphabot|Ch2-IO-Interfacing-and-Masking|Ch3-Motion-Control-and-Motor-Interfacing|Ch4-Pulse-Width-Modulation|Ch5-Ultrasonic-Sensor|Ch6-Analog-to-Digital-Converter|Ch7-Line-Following-Bot)/ {
        try_files $uri $uri/ /$1/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
